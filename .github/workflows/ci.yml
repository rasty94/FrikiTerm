name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Prueba del llavero real: opt-in. Sin definir la variable de repositorio, la prueba se salta.
      FRIKI_TEST_KEYRING: ${{ vars.FRIKI_TEST_KEYRING }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependencias de sistema (Linux, keyring/dbus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      - name: Pruebas de integración (sshd y telnetd de pruebas)
        if: matrix.os == 'ubuntu-latest'
        env:
          # Sin servidor, las pruebas de integración fallan en vez de saltarse.
          FRIKI_TEST_REQUIRED: "1"
        run: |
          eval "$(scripts/test-sshd.sh up)"
          eval "$(scripts/test-telnetd.sh up)"
          cargo test --workspace --no-fail-fast -- --include-ignored

      - name: Bajar servidores de pruebas
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          scripts/test-telnetd.sh down || true
          scripts/test-sshd.sh down

      - name: Instalar cargo-deny y cargo-audit
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1,cargo-audit@0.23.0

      - name: cargo deny
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

      - name: cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit -D warnings

  legacy:
    name: friki-ssh con feature legacy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependencias de sistema (keyring/dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Clippy (legacy)
        run: cargo clippy -p friki-ssh --features legacy --all-targets -- -D warnings

      - name: Tests (legacy)
        run: cargo test -p friki-ssh --features legacy

      - name: Dependencias de sistema (gssapi, MIT krb5)
        run: sudo apt-get install -y --no-install-recommends libkrb5-dev

      - name: Clippy (pkcs11, gssapi, http, s3)
        run: cargo clippy -p friki-cli --features pkcs11,gssapi,http,s3 --all-targets -- -D warnings

      - name: Tests (pkcs11, gssapi, http, s3)
        run: |
          cargo test -p friki-ssh --features pkcs11,gssapi
          cargo test -p friki-xfer -p friki-cli --features friki-xfer/http,friki-xfer/s3,friki-cli/http,friki-cli/s3

  fuzz:
    name: fuzzing (30 s por objetivo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependencias de sistema (keyring/dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Instalar nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Instalar cargo-fuzz
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz

      - name: Compilar objetivos
        working-directory: fuzz
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

      - name: Ejecutar objetivos
        working-directory: fuzz
        # Los objetivos salen de `cargo fuzz list` (bins de fuzz/Cargo.toml).
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=30 -timeout=10
          done

      - name: Subir artefactos de fallos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependencias de sistema (keyring/dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Instalar toolchain 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal

      - name: Compilar con la MSRV (rust-version del Cargo.toml raíz)
        run: cargo +1.89.0 build --workspace
