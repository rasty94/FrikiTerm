name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Pruebas de integración SSH (sshd de pruebas)
        if: matrix.os == 'ubuntu-latest'
        run: |
          eval "$(scripts/test-sshd.sh up)"
          cargo test --workspace -- --include-ignored

      - name: Bajar sshd de pruebas
        if: always() && matrix.os == 'ubuntu-latest'
        run: scripts/test-sshd.sh down

      - name: Instalar cargo-deny y cargo-audit
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check

      - name: cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit
