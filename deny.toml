# Política de cargo-deny para frikiSSH. Comprobar con: cargo deny check

[advisories]
version = 2
# Vulnerabilidades (por defecto deny), crates sin mantenimiento y versiones yanked bloquean el CI.
unmaintained = "all"
yanked = "deny"
# Excepciones revisadas a mano; quitar en cuanto el origen se actualice.
ignore = [
    # chrono sin mantenimiento: llega solo por russh -> russh-util; no lo usamos directamente.
    { id = "RUSTSEC-2026-0543", reason = "transitiva de russh-util; revisar al subir russh" },
]

[licenses]
version = 2
# Solo licencias permisivas, más MPL-2.0. MPL-2.0 es copyleft débil por fichero: aceptable como
# dependencia sin modificar (la trae option-ext vía directories). No obliga a licenciar el código propio.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
