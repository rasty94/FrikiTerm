# Política de cargo-deny para FrikiTerm. Comprobar con: cargo deny check

[advisories]
version = 2
# Vulnerabilidades (por defecto deny), crates sin mantenimiento y versiones yanked bloquean el CI.
unmaintained = "all"
yanked = "deny"
# Excepciones revisadas a mano; quitar en cuanto el origen se actualice.
# Todas: próxima revisión 2027-05-25.
ignore = [
    # chrono sin mantenimiento: llega solo por russh -> russh-util; no lo usamos directamente.
    { id = "RUSTSEC-2026-0543", reason = "sin mantenimiento, no es vulnerabilidad; transitiva de russh-util; revisar al subir russh (revisión 2027-05-25)" },
    # smartstring sin mantenimiento: la usa rhai internamente; sin alternativa sin cambiar de motor.
    { id = "RUSTSEC-2026-0249", reason = "sin mantenimiento, no es vulnerabilidad; transitiva de rhai, sin alternativa sin cambiar de motor; revisar al subir rhai (revisión 2027-05-25)" },
]

[licenses]
version = 2
# Solo licencias permisivas, más MPL-2.0. MPL-2.0 es copyleft débil por fichero: aceptable como
# dependencia sin modificar (la trae option-ext vía directories). No obliga a licenciar el código propio.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    # Permisivas: clipboard-win/error-code (vía arboard, solo Windows) y tiny-keccak.
    "BSL-1.0",
    "CC0-1.0",
    # Datos de raíces TLS (webpki-root-certs), vía rustls-platform-verifier de reqwest (feature http).
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
