[package]
name = "friki-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Algoritmos heredados (3DES, CBC, SHA-1, DH group1, DSA). Desactivado por defecto (TODO.md §11).
legacy = ["russh/des", "russh/dsa"]

[dependencies]
friki-core = { path = "../friki-core" }
async-trait = "0.1"
thiserror = "2"
russh = "0.65"
ssh-key = { version = "=0.7.0-rc.12", features = ["ed25519", "encryption", "rand_core", "std"] }
rand = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
