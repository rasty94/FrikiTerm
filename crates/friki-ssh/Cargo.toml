[package]
name = "friki-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Algoritmos heredados (3DES, CBC, SHA-1, DH group1, DSA). Desactivado por defecto (TODO.md §11).
legacy = ["russh/des", "russh/dsa"]

[dependencies]
friki-core = { path = "../friki-core" }
async-trait = "0.1"
thiserror = "2"
# Sin features por defecto: fuera flate2 (compresión) y la cripto se fija a aws-lc-rs + rsa.
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "rsa"] }
zeroize = "1"
rand = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
