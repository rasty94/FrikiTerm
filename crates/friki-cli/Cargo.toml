[package]
name = "friki-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "friki"
path = "src/main.rs"

[dependencies]
friki-core = { path = "../friki-core" }
friki-ssh = { path = "../friki-ssh" }
friki-term = { path = "../friki-term" }
friki-tui = { path = "../friki-tui" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
