[package]
name = "friki-xfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
friki-core = { path = "../friki-core" }
friki-ssh = { path = "../friki-ssh" }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "fs", "sync", "time", "macros", "rt"] }
globset = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
russh-sftp = "4"
suppaftp = { version = "13", features = ["tokio-rustls-aws-lc-rs"] }
rustls-native-certs = "0.8.5"
tokio-rustls = "0.26.6"

# Backends opcionales: HTTP/S (solo lectura) y S3 (SigV4 con rusty-s3; transporte reqwest+rustls).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
httpdate = { version = "1", optional = true }
rusty-s3 = { version = "0.12", optional = true }

[features]
http = ["dep:reqwest", "dep:futures-util", "dep:tokio-util", "dep:httpdate"]
s3 = ["http", "dep:rusty-s3"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
