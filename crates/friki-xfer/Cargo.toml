[package]
name = "friki-xfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
friki-core = { path = "../friki-core" }
friki-ssh = { path = "../friki-ssh" }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "fs", "sync", "time", "macros", "rt"] }
globset = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
