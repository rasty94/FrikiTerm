[package]
name = "friki-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

# Espacio de trabajo propio: el CI raíz (--workspace) no necesita webkit2gtk.
[workspace]

[dependencies]
friki-core = { path = "../../../crates/friki-core" }
friki-ssh = { path = "../../../crates/friki-ssh" }
friki-xfer = { path = "../../../crates/friki-xfer" }
friki-session = { path = "../../../crates/friki-session" }
friki-serial = { path = "../../../crates/friki-serial" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2.2"
directories = "6.0.0"
# Misma spec que friki-ssh: parsear claves (`keys_list`, `key_import`).
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
zeroize = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
# Mismo crate que friki-session usa para sus traits (ya en el lockfile).
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
