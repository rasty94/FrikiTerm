[package]
name = "friki-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

# Espacio de trabajo propio: el CI raíz (--workspace) no necesita webkit2gtk.
[workspace]

[dependencies]
friki-core = { path = "../../../crates/friki-core" }
friki-ssh = { path = "../../../crates/friki-ssh" }
friki-xfer = { path = "../../../crates/friki-xfer" }
# friki-pty, friki-telnet y friki-serial llegan con friki-session.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
zeroize = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
